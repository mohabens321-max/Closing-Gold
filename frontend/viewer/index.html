<!DOCTYPE html><html lang="fr" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Visite 360°</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="/static/viewer/style.css"></head><body>
<div id="cv"></div><div id="hs"></div><div id="ld"></div><div id="bar"></div>
<div id="zc"><button id="zm">🗺</button><button id="zi">+</button><button id="zo">−</button><button id="zr">⟲</button></div><div id="mp"><svg id="ms" viewBox="0 0 100 100"></svg></div><div id="joy"><div id="jk"></div></div>
<div id="sh"><button id="ldb" aria-label="Demander une visite" title="Demander une visite"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg><span>Demander une visite</span></button><button id="ifb" aria-label="Informations" title="Informations"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6h.01"/></svg></button><button id="shb" aria-label="Partager" title="Partager"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.7l6.8-4M8.6 13.3l6.8 4"/></svg></button><div id="shp"><a id="shf" target="_blank" rel="noreferrer">Facebook</a><a id="shw" target="_blank" rel="noreferrer">WhatsApp</a><button id="shc">Copier le lien</button></div></div>
<div id="lfm" hidden><div id="lfb">
  <button id="lfx" aria-label="Fermer" title="Fermer">✕</button>
  <div id="lf-form">
    <h3>Demander une visite</h3>
    <p id="lf-h" class="lfh"></p>
    <label>Nom complet<input id="lf-n" autocomplete="name" placeholder="Votre nom"></label>
    <label>Téléphone<input id="lf-p" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78"></label>
    <label>Date souhaitée (optionnel)<input id="lf-d" type="date"></label>
    <label>Message<textarea id="lf-m" rows="3" placeholder="Je souhaite visiter cette maison…"></textarea></label>
    <input id="lf-w" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <p id="lf-e" class="lfe"></p>
    <button id="lf-s" class="lfs">Envoyer la demande</button>
    <p class="lfn">L'agence vous rappelle pour confirmer le rendez-vous. Aucune donnée n'est partagée.</p>
  </div>
  <div id="lf-ok" hidden>
    <div class="lfc">✓</div>
    <h3>Demande envoyée !</h3>
    <p>L'agence vous contactera très vite pour confirmer votre visite.</p>
    <a id="lf-wa" class="lfw" target="_blank" rel="noreferrer" hidden>Ouvrir WhatsApp</a>
    <button id="lf-done" class="lfs">Fermer</button>
  </div>
</div></div>
<div id="ip"><button id="ipx" aria-label="Fermer" title="Fermer">✕</button><div id="ipb"></div><a id="ipw" class="ipw" target="_blank" rel="noreferrer">Contacter sur WhatsApp</a></div>
<div id="rw"><div id="rail"></div></div><div id="ic"><h3 id="it"></h3><p id="id"></p><button id="ix">Fermer</button></div><div id="msg"></div>
